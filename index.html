<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="康思义生日快乐纪念网页" />
  <title>康思义 · 生日快乐</title>
  <style>
    :root {
      --pink: #ff8fab;
      --deep-pink: #ff2e88;
      --cream: #fff8f0;
      --warm: #ffb677;
      --gold: #f9c74f;
      --ink: #5a3d3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 45%, #ffb88c 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* 柔和飘动的小星星和爱心背景 */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-decor span {
      position: absolute;
      bottom: -10vh;
      animation: floatUp linear infinite;
      opacity: 0.45;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-120vh) rotate(360deg); }
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(680px, 100%);
      background: rgba(255, 250, 245, 0.86);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      box-shadow: 0 24px 70px rgba(120, 40, 60, 0.30);
      padding: 48px 36px 40px;
      text-align: center;
      animation: popIn 0.9s cubic-bezier(.2, 1.2, .3, 1) both;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .emoji-banner {
      font-size: clamp(48px, 10vw, 78px);
      line-height: 1;
      margin-bottom: 8px;
      animation: bounce 2.4s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .name {
      font-size: clamp(44px, 9vw, 68px);
      font-weight: 900;
      background: linear-gradient(120deg, var(--deep-pink), var(--warm));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 6px;
      margin: 6px 0 4px;
    }

    .subtitle {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 700;
      color: var(--deep-pink);
      margin-bottom: 18px;
    }

    .message {
      max-width: 480px;
      margin: 0 auto 26px;
      font-size: 17px;
      line-height: 1.9;
      color: #6d4a4a;
    }

    .candle-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      max-width: 460px;
      margin: 26px auto 22px;
      align-items: flex-end;
    }

    .candle {
      position: relative;
      width: 22px;
      height: 70px;
      border-radius: 8px 8px 5px 5px;
      background: repeating-linear-gradient(
        45deg,
        var(--c1, #ffb3c6),
        var(--c1, #ffb3c6) 6px,
        #ffffff 6px,
        #ffffff 10px
      );
      box-shadow: inset -4px 0 8px rgba(0,0,0,0.08);
      animation: candleSway 3s ease-in-out infinite;
    }

    .candle::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 16px;
      background: radial-gradient(ellipse at 50% 35%, #fff5b0 12%, #ff9f1c 48%, transparent 70%);
      border-radius: 50% 50% 40% 40%;
      box-shadow: 0 0 16px 5px rgba(255, 180, 70, 0.6);
      animation: flicker 0.8s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); opacity: 0.95; }
      100% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    }

    @keyframes candleWish {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    .candle:nth-child(2) { --c1: #ff9f9f; animation-delay: -0.6s; }
    .candle:nth-child(3) { --c1: #ffd166; animation-delay: -1.2s; }
    .candle:nth-child(4) { --c1: #7ae0c3; animation-delay: -1.8s; }
    .candle:nth-child(5) { --c1: #b6b6ff; animation-delay: -2.4s; }
    .candle:nth-child(6) { --c1: #ffb3c6; animation-delay: -3.0s; }
    .candle:nth-child(7) { --c1: #ff9f9f; animation-delay: -3.6s; }
    .candle:nth-child(8) { --c1: #ffd166; animation-delay: -4.2s; }
    .candle:nth-child(9) { --c1: #7ae0c3; animation-delay: -4.8s; }
    .candle:nth-child(10) { --c1: #b6b6ff; animation-delay: -5.4s; }
    .candle:nth-child(11) { --c1: #ffb3c6; animation-delay: -6.0s; }
    .candle:nth-child(12) { --c1: #ff9f9f; animation-delay: -6.6s; }
    .candle:nth-child(13) { --c1: #ffd166; animation-delay: -7.2s; }
    .candle:nth-child(14) { --c1: #7ae0c3; animation-delay: -7.8s; }
    .candle:nth-child(15) { --c1: #b6b6ff; animation-delay: -8.4s; }
    .candle:nth-child(16) { --c1: #ffb3c6; animation-delay: -9.0s; }
    .candle:nth-child(17) { --c1: #ff9f9f; animation-delay: -9.6s; }
    .candle:nth-child(18) { --c1: #ffd166; animation-delay: -10.2s; }
    .candle:nth-child(19) { --c1: #7ae0c3; animation-delay: -10.8s; }
    .candle:nth-child(20) { --c1: #b6b6ff; animation-delay: -11.4s; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 6px;
    }

    button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      padding: 13px 26px;
      border-radius: 999px;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(120deg, var(--deep-pink), #ff6b7a);
      box-shadow: 0 12px 26px rgba(255,46,136,0.35);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(255,46,136,0.42);
    }

    .btn-ghost {
      color: var(--deep-pink);
      background: rgba(255, 226, 229, 0.9);
      box-shadow: 0 8px 18px rgba(180, 50, 80, 0.12);
    }

    .btn-ghost:hover {
      transform: translateY(-3px);
      background: rgba(255, 214, 219, 0.95);
    }

    .date {
      margin-top: 28px;
      font-size: 14px;
      color: #a07979;
      letter-spacing: 2px;
    }

    @media (max-width: 480px) {
      .card { padding: 32px 18px 28px; }
      .message { font-size: 15px; }
    }

    .gift {
      margin: 4px auto 24px;
      max-width: 480px;
      padding: 18px 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 244, 214, 0.92), rgba(255, 219, 220, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 28px rgba(120, 40, 60, 0.12);
      position: relative;
    }

    .gift-title {
      font-size: 17px;
      font-weight: 800;
      color: #7a3b3b;
      margin-bottom: 6px;
    }

    .gift-desc {
      font-size: 14px;
      line-height: 1.7;
      color: #8a5a5a;
      margin-bottom: 12px;
    }

    .gift-code {
      display: inline-block;
      font-size: 13px;
      background: rgba(122, 59, 59, 0.08);
      border-radius: 10px;
      padding: 4px 10px;
      margin-bottom: 12px;
    }

    .gift-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .btn-steam {
      color: #fff;
      background: linear-gradient(120deg, #1b2838, #2a475e);
      box-shadow: 0 10px 22px rgba(27, 40, 56, 0.28);
    }

    .btn-steam:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(27, 40, 56, 0.36);
    }

    .gift-note {
      display: block;
      width: 100%;
      font-size: 14px;
      color: #8a5a5a;
      line-height: 1.7;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      padding: 9px 12px;
    }

    .gift-note b {
      color: #5a2d2d;
    }

    /* ---- 拆礼物交互 ---- */
    .gift-box {
      cursor: pointer;
      user-select: none;
      padding: 28px 16px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 236, 201, 0.95), rgba(255, 208, 216, 0.95));
      border: 2px dashed rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 28px rgba(120, 40, 60, 0.14);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .gift-box:hover {
      transform: scale(1.03);
      box-shadow: 0 14px 34px rgba(120, 40, 60, 0.2);
    }

    .gift-box:active {
      transform: scale(0.97);
    }

    .gift-box-emoji {
      font-size: 64px;
      line-height: 1.2;
      animation: bounce 2.4s ease-in-out infinite;
      display: inline-block;
      filter: drop-shadow(0 6px 12px rgba(255, 140, 90, 0.45));
    }

    .gift-box-text {
      font-size: 19px;
      font-weight: 800;
      color: #7a3b3b;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .gift-box-hint {
      font-size: 13px;
      color: #a07979;
      margin-top: 6px;
    }

    .gift-box.opening {
      animation: giftShake 0.6s ease-in-out;
    }

    @keyframes giftShake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-9px) rotate(-2.5deg); }
      40% { transform: translateX(9px) rotate(2.5deg); }
      60% { transform: translateX(-6px) rotate(-1.5deg); }
      80% { transform: translateX(6px) rotate(1.5deg); }
    }

    .gift-box.opened {
      animation: boxPop 0.55s ease-out both;
    }

    @keyframes boxPop {
      0% { opacity: 1; transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    .gift-content {
      animation: giftReveal 0.7s cubic-bezier(.2, 1.2, .3, 1) both;
    }

    @keyframes giftReveal {
      0% { opacity: 0; transform: translateY(20px) scale(0.93); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="card">
    <div class="emoji-banner" role="img" aria-label="生日蛋糕">🎂</div>
    <h1 class="name">康思义</h1>
    <div class="subtitle">🎂 20 岁生日快乐！</div>
    <p class="message">
      想说的很多，但是好像也没啥好说的，<br />
      祝你 20 岁生日快乐<br />
      ——致康思义
    </p>

    <div class="candle-box">
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
      <div class="candle"></div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="music-btn" type="button">🎵 播放生日歌</button>
      <button class="btn-ghost" id="confetti-btn" type="button">🎉 撒花</button>
    </div>

    <section class="gift" id="gift-section">
      <div class="gift-box" id="gift-box" role="button" tabindex="0" aria-label="点击拆开生日礼物">
        <div class="gift-box-emoji">🎁</div>
        <div class="gift-box-text">点击拆开你的生日礼物</div>
        <div class="gift-box-hint">有一份惊喜在等着你 🎂</div>
      </div>
      <div class="gift-content" id="gift-content" hidden>
        <div class="gift-title">🎉 礼物拆开啦！</div>
        <p class="gift-desc">
          桌游模拟器，可以去 B 站搜视频看看怎么玩，<br />
          后续有机会可以在上面打诡镇奇谈或者其他桌游。
        </p>
        <div class="gift-code">🎮 桌游模拟器 · Tabletop Simulator</div>
        <div class="gift-links">
          <span class="gift-note">💌 这份礼物会以 <b>Steam 礼物</b> 的形式送到你手上，记得查收哦</span>
          <button class="btn-steam button" id="gift-sent-button" type="button">🎁 礼物已送出</button>
        </div>
      </div>
    </section>

    <div class="date" id="date-line"></div>
  </main>

  <script>
    // 背景飘动装饰
    (function decor() {
      const container = document.querySelector('.bg-decor');
      const symbols = ['🎈', '🎀', '✨', '💖', '⭐', '🎊'];
      for (let i = 0; i < 18; i++) {
        const span = document.createElement('span');
        span.textContent = symbols[i % symbols.length];
        span.style.left = Math.random() * 100 + '%';
        span.style.fontSize = 18 + Math.random() * 30 + 'px';
        span.style.animationDuration = 8 + Math.random() * 10 + 's';
        span.style.animationDelay = -Math.random() * 15 + 's';
        container.appendChild(span);
      }
    })();

    // 当前日期
    (function renderDate() {
      const now = new Date();
      const text = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 · 纪念日';
      document.getElementById('date-line').textContent = text;
    })();

    // 彩带粒子
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    const particles = [];
    let running = false;

    const COLORS = ['#ff2e88', '#ffb677', '#fbb74f', '#56cfae', '#6aa7ff', '#ffffff'];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function randomConfetti() {
      const size = 7 + Math.random() * 7;
      return {
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.3,
        w: size,
        h: size * (0.5 + Math.random()),
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vy: 2 + Math.random() * 4,
        vx: -1 + Math.random() * 2,
        angle: Math.random() * Math.PI * 2,
        spin: -0.1 + Math.random() * 0.2,
        opacity: Math.random() * 0.6 + 0.4,
        life: 1
      };
    }

    function burst() {
      for (let i = 0; i < 120; i++) {
        particles.push(randomConfetti());
      }
      runAnimation();
    }

    let rafId = null;

    function runAnimation() {
      if (rafId === null) rafId = requestAnimationFrame(tick);
      return true;
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.angle += p.spin;
        p.vy += 0.02;
        p.life -= 0.003;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life) * p.opacity;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();

        if (p.life <= 0 || p.y > canvas.height + 40) {
          particles.splice(i, 1);
        }
      }

      if (particles.length > 0) {
        rafId = requestAnimationFrame(tick);
      } else {
        rafId = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    document.getElementById('confetti-btn').addEventListener('click', burst);

    // 用 Web Audio 播放《祝你生日快乐》主旋律
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isPlaying = false;

    // 音高频率表（C 大调）
    const NOTE_FREQ = {
      'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
      'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25
    };

    // 简谱：Happy Birthday 的前两句（6/8 拍简化处理）
    const MELODY = [
      ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
      ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
      ['G4', 0.75], ['G4', 0.25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
      ['F5', 0.75], ['F5', 0.25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2]
    ];

    function playTone(freq, duration = 1) {
      if (!audioCtx) audioCtx = new AudioCtx();
      const now = audioCtx.currentTime;
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = 'triangle';
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.frequency.value = freq;
      oscillator.start(now);
      oscillator.stop(now + duration + 0.05);
    }

    function playBirthdaySong() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let cursor = 0;
      MELODY.forEach(([note, beats], index) => {
        setTimeout(() => {
          const freq = NOTE_FREQ[note];
          if (freq) playTone(freq, beats * 0.38 + 0.15);
        }, cursor * 1000);
        cursor += beats * 0.38 + 0.15;
      });

      // 播完后撒一波彩带
      const totalMs = (cursor + 0.4) * 1000;
      setTimeout(() => {
        burst();
        isPlaying = false;
        document.getElementById('music-btn').textContent = '🎵 播放生日歌';
      }, totalMs);
    }

    document.getElementById('music-btn').addEventListener('click', function () {
      if (isPlaying) return;
      isPlaying = true;
      this.textContent = '🎶 正在播放…';
      playBirthdaySong();
    });

    const giftSentBtn = document.getElementById('gift-sent-button');
    if (giftSentBtn) {
      giftSentBtn.addEventListener('click', function () {
        burst();
        this.textContent = '✅ 已送出';
        this.disabled = true;
      });
    }

    // 拆礼物交互:点击礼物盒 -> 晃动 -> 撒花 -> 盒子打开,内容浮现
    const giftBox = document.getElementById('gift-box');
    const giftContent = document.getElementById('gift-content');
    if (giftBox && giftContent) {
      let opened = false;
      function openGift() {
        if (opened) return;
        opened = true;
        giftBox.classList.add('opening');
        setTimeout(function () {
          giftBox.classList.remove('opening');
          giftBox.classList.add('opened');
          burst();
          giftContent.hidden = false;
          setTimeout(function () {
            giftBox.style.display = 'none';
          }, 550);
        }, 600);
      }
      giftBox.addEventListener('click', openGift);
      giftBox.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openGift();
        }
      });
    }
  </script>
</body>
</html>
